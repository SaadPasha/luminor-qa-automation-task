plugins {
    id 'java'
}

group = 'com.saad.luminor'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

configurations {
    aspectjAgent
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def allureAdapterVersion = '2.35.4'
def aspectjVersion = '1.9.25.1'

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    testImplementation 'io.rest-assured:rest-assured:5.5.6'
    testImplementation 'com.codeborne:selenide:7.10.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    testImplementation 'org.assertj:assertj-core:3.27.4'

    testImplementation "io.qameta.allure:allure-rest-assured:${allureAdapterVersion}"
    testImplementation "io.qameta.allure:allure-selenide:${allureAdapterVersion}"
    testImplementation "io.qameta.allure:allure-junit5:${allureAdapterVersion}"
    testImplementation 'org.slf4j:slf4j-api:2.0.17'

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.18'
    testRuntimeOnly "org.aspectj:aspectjrt:${aspectjVersion}"
    aspectjAgent "org.aspectj:aspectjweaver:${aspectjVersion}"
}

def allureResultsDir = layout.buildDirectory.dir('allure-results')
def allureReportDir = layout.buildDirectory.dir('allure-report')


def isWindows =
        System.getProperty('os.name')
                .toLowerCase()
                .contains('windows')

def allureCommand = isWindows
        ? ['cmd', '/c', 'allure']
        : ['allure']

def allureReportTask = tasks.register('allureReport', Exec) {
    group = 'verification'
    description = 'Generates the Allure HTML report'

    doFirst {
        def resultsDirectory = allureResultsDir.get().asFile

        if (!resultsDirectory.exists() ||
                resultsDirectory.listFiles() == null ||
                resultsDirectory.listFiles().length == 0) {
            throw new GradleException(
                    "No Allure results found in ${resultsDirectory}"
            )
        }

        delete allureReportDir
    }

    commandLine(
            allureCommand + [
                    'generate',
                    '--output',
                    allureReportDir.get().asFile.absolutePath,
                    allureResultsDir.get().asFile.absolutePath
            ]
    )
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    systemProperty 'env',
            providers.gradleProperty('env')
                    .orElse('default')
                    .get()

    systemProperty 'allure.results.directory',
            allureResultsDir.get().asFile.absolutePath

    systemProperty 'browser',
            providers.gradleProperty('browser')
                    .orElse('chrome')
                    .get()

    systemProperty 'headless',
            providers.gradleProperty('headless')
                    .orElse('false')
                    .get()

    doFirst {
        jvmArgs "-javaagent:${configurations.aspectjAgent.singleFile}"
    }

    finalizedBy allureReportTask
}
tasks.register('sanityTest', Test) {
    group = 'verification'
    description = 'Runs the API sanity test suite'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'sanity'
    }
}

tasks.register('regressionTest', Test) {
    group = 'verification'
    description = 'Runs the complete regression test suite'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()
}

test {
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}