name: Run - Regression Suite

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  tests:
    if: ${{ github.event.pull_request.merged == true }}
    name: Run Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Allure CLI
        run: npm install --global allure-commandline

      - name: Verify Allure CLI
        run: allure --version

      - name: Clean previous build
        run: ./gradlew clean

      - name: Restore regression Allure history
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-regression-master-${{ github.run_id }}
          restore-keys: |
            allure-history-regression-master-

      - name: Add previous history to Allure results
        run: |
          if [ -d "allure-history" ]; then
            mkdir -p build/allure-results/history
            cp -r allure-history/. build/allure-results/history/
            echo "Previous regression history restored"
          else
            echo "No previous regression history found"
          fi

      - name: Run regression tests
        id: regression-tests
        continue-on-error: true
        run: ./gradlew regressionTest -Pheadless=true

      - name: Verify Allure report
        if: always()
        run: |
          test -f build/allure-report/index.html
          echo "Regression Allure report generated successfully"

      - name: Collect updated regression history
        if: always()
        run: |
          if [ -d "build/allure-report/history" ]; then
            rm -rf allure-history
            mkdir -p allure-history
            cp -r build/allure-report/history/. allure-history/
            echo "Updated regression history collected"
          else
            echo "Regression history was not generated"
          fi

      - name: Save regression Allure history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-regression-master-${{ github.run_id }}

      - name: Add .nojekyll
        if: always()
        run: touch build/allure-report/.nojekyll

      - name: Upload regression Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-allure-results-${{ github.run_number }}
          path: build/allure-results
          retention-days: 7
          if-no-files-found: warn

      - name: Upload regression Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-allure-report-${{ github.run_number }}
          path: build/allure-report
          retention-days: 14
          if-no-files-found: warn

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Allure report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: build/allure-report

      - name: Fail workflow when regression tests fail
        if: steps.regression-tests.outcome == 'failure'
        run: |
          echo "One or more regression tests failed"
          exit 1

  deploy:
    name: Publish Regression Allure report
    needs: tests
    if: >-
      ${{
        always() &&
        github.event.pull_request.merged == true &&
        needs.tests.result != 'cancelled'
      }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Regression Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4